<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store" />
<title>角色卡</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,sans-serif;background:#f0e9de;display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid rgba(74,52,44,.12)}
a{color:#4a342c;font-size:13px;font-weight:700;text-decoration:none}
iframe{flex:1;width:100%;border:0;background:transparent}
</style>
</head>
<body>
<header>
  <a href="#" id="homeBtn">返回主页</a>
  <strong style="font-size:14px">角色卡</strong>
</header>
<iframe id="cardFrame" title="角色卡"></iframe>
<script>
function token() {
  const q = new URLSearchParams(location.search).get("auth_token");
  if (q) { try { localStorage.setItem("token", q); } catch (e) {} return q; }
  return localStorage.getItem("token") || "";
}
function homeUrl() {
  return location.pathname.indexOf("/qqbot/") === 0 ? "/qqbot/" : "/";
}
document.getElementById("homeBtn").onclick = (e) => {
  e.preventDefault();
  location.assign(homeUrl());
};
const t = token();
const prefix = location.pathname.indexOf("/qqbot/") === 0 ? "/qqbot" : "";
let src = prefix + "/backend-api/api/persona/card-ui?embed=1";
if (t) src += "&auth_token=" + encodeURIComponent(t);
document.getElementById("cardFrame").src = src;
</script>
</body>
</html>
