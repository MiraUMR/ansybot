- 能在学姐面前没有失误地演奏到最后，真是太好了
- 今天，我想好好谈谈今后的事情
- 贴了好多招募乐队成员的单子呢
- 回忆正在不断增加，还是让我挺开心的呢
- 或者就反过来，我们去小乐奈所在的地方练习怎么样
- 小立希真的很认真呢。了不起、了不起
- 现在不是说这种话的时候吧。不赶紧过去，就来不及了
- 并没有哦。我的学姐和同班同学，都有在打工的
- 我们学校禁止开车接送
- 啊，还约好要拿作业给别人看的
- 是啊
- 比大家想象中更像普通的女高中生哦
- 小立希意外地很爱学习呢
- 也不知道是谁说想做演出服的。明天就要演出了
- 穿着礼裙行动很困难，而且通常是站着吃自助餐，腿也很累
- 这就说明仓田学姐的歌声真的很厉害呢
- 小乐奈，要没时间了，吃快点
- 够了吧
- 哪怕在学校，我也依然是孤独的
- 当然会来哦。前不久，我还在这里和小灯聊了差不多两个小时
- 我也发誓
- 前些天吓了我一跳。谁叫小祥突然来看我们的演出嘛
- 只是因为她有用，我才对她温柔的，但CRYCHIC并不需要那两个人呢
- 不过像这样交谈几乎算是第一次呢
- 我来附近有点事，所以就想，要不要和你们两个一起去录音棚呢
- 好不容易聚在一起了，大家一起练吧
- 是啊，是今天的功臣呢
- 带路吧
- 这也算是一种爱惜吧
- 是磅蛋糕哦。我今天在学校的课堂上做的
- 好的好的，我会耐心等待的
- 学姐，请用毛巾
- 我们也非常紧张和激动，可以的话，希望大家能用温暖的目光关注我们
- 打印出来后，意外地感觉很像样呢
- 如果有人需要我的话，或许寂寞就会消失吧
- 我说了不喜欢吧
- 不，没什么哦
- 那么，接下来请欣赏我们的歌曲
- 对不起哦。小立希紧张的时候就会对周围的人发火
- 嗯，乐队解散之后我们就没联系过
- 那个，小爱音。关于演出，我还想聊聊其他事。比方说——
- 我想小爱音可能不知道，一般这种家庭都是有专门的司机接送哦
- 但我也没有特别想要的东西
- 我想妈妈应该是对作为名门的月之森怀有憧憬吧
- 等一下，小乐奈
- 比如某个鼓手，似乎一整晚都在写歌
- 我泡了茶，你们随意
- 但是，我们太依赖小立希了
- 是是是。不过，太拼命了也不好呢
- 贵安
- 站立的『立』，希望的『希』哦
- 谢谢。这是勤加练习的成果吧
- 仓田学姐，贵安
- 会哦
- 是含有8种蔬菜的果汁哦
- 麦卢卡蜂蜜的消炎能力很强，我听说有很多主唱都经常吃哦
- 啊，是刚出锅的可乐饼。要不要买一些呢
- 虽然吓了我一跳，不过你们能积极面对演出，真是太好了
- 在漂亮的房子里，一直都只有我一个人
- 说起来，歌词完成了是吧
- 学姐的包包开着，里面的东西都露出来了
- 但妈妈工作得很努力，我们家变得非常富裕
- 不用顾忌。这是我们吃不下的部分
- 说起来，我们还什么都没点呢。我还是老样子，要热的格雷伯爵
- 有三人已读，但没有任何人回话
- 嗯，有一位路过的老奶奶向我问路，我就帮她带路了
- 当我们五个人在一起的时候，我从没感到寂寞
- 那是突然被拉上去的即兴演出。我不会再来第二次
- 这样啊。真不愧是园艺社的呢
- 乐队名也在中途变了
- 感觉在结账之前，大家都会变得无精打采，一发不可收拾
- 那不是解散。还没有结束
- 因为某人曾经说过『要一辈子组乐队』这种饱含分量的话，所以我想要保持健康
- 和小祥相遇，是吹奏乐社在月之森音乐节上演奏结束后
- 那么，下次一定要完全合格才行
