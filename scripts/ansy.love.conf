server {
    listen 80;
    server_name ansy.love www.ansy.love;
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/ansy.love;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ansy.love www.ansy.love;

    ssl_certificate    /www/server/panel/vhost/cert/ansy.love/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ansy.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;

    root /www/wwwroot/ansy.love;
    index index.html;

    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Existing site API — unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # QQ webhook only.
    location /im/webhook/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location = /qqbot {
        return 302 /qqbot/;
    }

    # NapCat WebUI lives on :6099 (token required). This path only
    # exists so /qqbot/ does not swallow a mistaken /qqbot/napcat hit.
    location = /qqbot/napcat {
        return 302 http://$host:6099/webui/;
    }
    location ^~ /qqbot/napcat/ {
        return 302 http://$host:6099/webui/;
    }

    # WorkflowList uses window.open("/workflow/..."), which would otherwise
    # hit the main site SPA and look like a jump back to the homepage.
    location ^~ /workflow {
        return 302 /qqbot$request_uri;
    }

    # Kirara API under the isolated prefix.
    location /qqbot/backend-api/ {
        proxy_pass http://127.0.0.1:8080/backend-api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    location = /qqbot/llm-priority {
        proxy_pass http://127.0.0.1:8080/backend-api/api/llm/priority/ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /qqbot/world-state {
        proxy_pass http://127.0.0.1:8080/backend-api/api/world-state/ui;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location = /qqbot/persona {
        proxy_pass http://127.0.0.1:8080/backend-api/api/persona/ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location = /qqbot/children-mode {
        proxy_pass http://127.0.0.1:8080/backend-api/api/children-mode/ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # Kirara WebUI static files. Does not serve the main site's /assets/.
    location /qqbot/ {
        alias /opt/kirara-ai/webui/;
        index index.html;
        try_files $uri $uri/ @kirara_spa;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location @kirara_spa {
        rewrite ^ /qqbot/index.html last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/ansy.love.log;
    error_log  /www/wwwlogs/ansy.love.error.log;
}
