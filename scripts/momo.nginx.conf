# 莫莫 / CowAgent 控制台。微信收发走容器长轮询，不经过本站点。
# 与 QQ 的 /qqbot/ 隔离：CowAgent 前端占用站点根路径 /api/，不能挂在 ansy.love/momo 子路径。
# 使用已有 ansy.love 证书，监听 8444，避免新开子域名等 DNS。

server {
    listen 8444 ssl;
    http2 on;
    server_name ansy.love www.ansy.love;

    ssl_certificate    /www/server/panel/vhost/cert/ansy.love/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/ansy.love/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;

    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:9899;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect ~^https?://[^/]+(/.*)$ https://ansy.love:8444$1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
    }

    access_log /www/wwwlogs/momo.ansy.love.log;
    error_log  /www/wwwlogs/momo.ansy.love.error.log;
}
